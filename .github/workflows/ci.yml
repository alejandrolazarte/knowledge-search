name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore knowledge-search.slnx

      - name: Build
        run: dotnet build knowledge-search.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test knowledge-search.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test/Api.Tests/TestResults/results.trx
          retention-days: 30

  e2e-tests:
    name: E2E Tests
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate

      - name: Restore .NET packages
        run: dotnet restore knowledge-search.slnx

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build frontend into API
        run: pnpm --dir app run build

      - name: Install Playwright browsers
        run: pnpm --dir e2e run install:browsers

      - name: Run E2E tests
        run: pnpm --dir e2e run test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
